[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "llama-index-tools-superion"
version = "0.1.0"
description = "llama-index tools superion integration — calibrated yes/no, choice and score decisions (Superion S1 by Punky Tiger Labs)."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.9,<4.0"
authors = [{ name = "Punky Tiger Labs", email = "alvaro.lopez@punkytigerlabs.com" }]
keywords = ["llama-index", "superion", "classification", "guardrail", "calibrated", "tool"]
dependencies = ["llama-index-core>=0.12.0,<0.15", "superion-s1>=0.1.0,<1"]

[project.optional-dependencies]
test = ["pytest>=7", "pytest-asyncio>=0.23", "respx>=0.21"]

[project.urls]
Homepage = "https://punkytigerlabs.com/s1/"
Source = "https://github.com/PunkyTigerLabs/superion-s1/tree/main/integrations/llamaindex"

[tool.hatch.build.targets.sdist]
include = ["llama_index/"]

[tool.hatch.build.targets.wheel]
include = ["llama_index/"]

[tool.llamahub]
contains_example = false
import_path = "llama_index.tools.superion"

[tool.llamahub.class_authors]
SuperionToolSpec = "PunkyTigerLabs"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
