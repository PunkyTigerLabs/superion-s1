openapi: 3.1.0
info:
  title: Superion S1 API
  version: "1.1.0"
  summary: Calibrated decisions in one call — yes/no, choice and score probabilities, no text generation.
  description: |
    Superion S1 by Punky Tiger Labs is a **calibrated decision API**. Send a text (the
    *state*, up to 32,768 tokens per question) and any number of typed questions:

    * `noul` — yes/no, returns the probability of `true`;
    * `choice` — pick one of 2–255 options, returns the chosen option, a probability per option id and a confidence;
    * `score` — an ordered scale of 2–16 levels, returns the expected level, a probability per level, a confidence and a legend.

    One request returns one probability distribution per question, without generating text, in
    well under a second. Output tokens are always 0 and free. The API follows the standard
    System One request and response format. Responses are deterministic: a pinned model version
    returns the same probabilities for the same request.

    **#1 of 213 on S1MB English v1 — Task Average 75.06 · Borda 89.88 (Nov 2026)**
    ([leaderboard](https://huggingface.co/datasets/hotchpotch/s1mb-result)).
    Built on Gemma 4 26B-A4B, INT4 experts.

    **Plans.** Free: 100 M input tokens per day per key, permanent. Prepaid: 0.042 USD per
    million input tokens, output free. Contract: dedicated key. Get a key at
    https://punkytigerlabs.com/s1/.

    **Browsers.** `/v1/systemone`, `/v1/usage` and `/v1/keys/*` are server-to-server and send
    no CORS headers. Call them from your backend. `/health` and `/v1/models` are public.

    **Timeouts.** Use a client timeout of at least 120 s: most requests finish well under a
    second, but a large state arriving while the fair queue is full can wait up to ~70 s.
  termsOfService: https://punkytigerlabs.com/s1/terms
  contact:
    name: Punky Tiger Labs
    url: https://punkytigerlabs.com/s1/support
    email: alvaro.lopez@punkytigerlabs.com
  license:
    name: Proprietary service (this specification is MIT)
    identifier: MIT
  x-logo:
    url: https://punkytigerlabs.com/favicon.ico
externalDocs:
  description: Documentation
  url: https://punkytigerlabs.com/s1/docs
servers:
  - url: https://api.punkytigerlabs.com
    description: Production (EU)
tags:
  - name: Decisions
    description: Calibrated typed decisions over a text state.
  - name: Models
    description: Served model versions (immutable IDs).
  - name: Account
    description: Usage, balance and key management for the calling key.
  - name: Service
    description: Health check.
security:
  - bearerAuth: []

paths:
  /v1/systemone:
    post:
      tags: [Decisions]
      operationId: createDecision
      summary: Answer typed questions about a state with calibrated probabilities
      description: |
        Billed input tokens = the state once + every question's instructions, criteria and
        option labels (Gemma 4 tokenizer). Failed requests (any 4xx/5xx) are not charged.
        Limits: each question (state + that question) ≤ 32,768 tokens; each request ≤ 65,536
        billable input tokens; body ≤ 4 MB. Longer inputs are refused with 422, never truncated.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DecisionRequest"
            examples:
              support_ticket:
                $ref: "#/components/examples/SupportTicketRequest"
              moderation:
                $ref: "#/components/examples/ModerationRequest"
      responses:
        "200":
          description: One answer per question.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/X-Request-ID"
            X-RateLimit-Limit:
              $ref: "#/components/headers/X-RateLimit-Limit"
            X-RateLimit-Remaining:
              $ref: "#/components/headers/X-RateLimit-Remaining"
            X-RateLimit-Reset:
              $ref: "#/components/headers/X-RateLimit-Reset"
            X-RateLimit-Limit-Tokens:
              $ref: "#/components/headers/X-RateLimit-Limit-Tokens"
            X-RateLimit-Remaining-Tokens:
              $ref: "#/components/headers/X-RateLimit-Remaining-Tokens"
            X-RateLimit-Limit-Tokens-Day:
              $ref: "#/components/headers/X-RateLimit-Limit-Tokens-Day"
            X-RateLimit-Remaining-Tokens-Day:
              $ref: "#/components/headers/X-RateLimit-Remaining-Tokens-Day"
            X-RateLimit-Reset-Day:
              $ref: "#/components/headers/X-RateLimit-Reset-Day"
            X-S1-Balance-USD:
              $ref: "#/components/headers/X-S1-Balance-USD"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DecisionResponse"
              examples:
                support_ticket:
                  $ref: "#/components/examples/SupportTicketResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "402":
          $ref: "#/components/responses/PaymentRequired"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "422":
          $ref: "#/components/responses/Unprocessable"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /v1/models:
    get:
      tags: [Models]
      operationId: listModels
      summary: List served models
      description: Public (no key needed). IDs are immutable; retirement comes with at least 90 days notice.
      security: []
      responses:
        "200":
          description: Served models.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ModelList"

  /v1/usage:
    get:
      tags: [Account]
      operationId: getUsage
      summary: Plan, today's counters, limits and (Prepaid) balance, history and purchases
      responses:
        "200":
          description: Usage of the calling key.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Usage"
              examples:
                prepaid:
                  value:
                    key_id: key_example
                    plan: prepaid
                    day_utc: "20261112"
                    requests_today: 1840
                    tokens_today: 412300
                    limits:
                      requests_per_minute: 1500
                      tokens_per_minute: 7500000
                      requests_per_day: null
                      tokens_per_day: null
                      tokens_per_month: null
                    balance_usd: 19.982684
                    price_usd_per_million_input_tokens: 0.042
                    output_tokens_price: 0
                    history:
                      - {day_utc: "20261112", requests: 1840, input_tokens: 412300, cost_usd: 0.017316}
                    purchases:
                      - {t: 1794931200, usd: 20.0, ref: "cs_example"}
        "401":
          $ref: "#/components/responses/Unauthorized"

  /v1/keys/rotate:
    post:
      tags: [Account]
      operationId: rotateKey
      summary: Rotate the calling key
      description: Returns a new key; the old one stops working at once. Store the new key immediately — it is shown only here.
      responses:
        "201":
          description: New key issued.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RotatedKey"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /v1/keys/revoke:
    post:
      tags: [Account]
      operationId: revokeKey
      summary: Revoke the calling key
      description: Disables the key permanently.
      responses:
        "200":
          description: Key revoked.
          content:
            application/json:
              schema:
                type: object
                required: [key_id, revoked]
                properties:
                  key_id: {type: string}
                  revoked: {type: boolean, const: true}
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /health:
    get:
      tags: [Service]
      operationId: getHealth
      summary: Service health
      security: []
      responses:
        "200":
          description: Service is up.
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status: {type: string, const: ok}

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: "s1k_…"
      description: "API key from https://punkytigerlabs.com/s1/account — `Authorization: Bearer s1k_…`."

  schemas:
    ModelId:
      type: string
      description: |
        Immutable model version ID (the hash after `@sha256:` identifies the exact package served), or
        `superion-s1-latest`, which follows the current recommended release. If `model` is omitted,
        `superion-s1-latest` is used. Responses always name the pinned release that answered.
      examples:
        - superion-s1-latest
        - superion-s1-v6-int4e-vllm-kv1@sha256:e6dc49dc
        - superion-s1-v5-int4e-vllm-kv1@sha256:47f7571c

    DecisionRequest:
      type: object
      required: [state, questions]
      additionalProperties: false
      properties:
        model:
          $ref: "#/components/schemas/ModelId"
        state:
          type: string
          description: The text the questions are about (message, ticket, document, transcript…). Counted once per request.
          minLength: 1
        questions:
          type: object
          description: Map of your question id → question. Any number of questions within the token limits.
          minProperties: 1
          additionalProperties:
            $ref: "#/components/schemas/Question"

    Question:
      oneOf:
        - $ref: "#/components/schemas/NoulQuestion"
        - $ref: "#/components/schemas/ChoiceQuestion"
        - $ref: "#/components/schemas/ScoreQuestion"
      discriminator:
        propertyName: type
        mapping:
          noul: "#/components/schemas/NoulQuestion"
          choice: "#/components/schemas/ChoiceQuestion"
          score: "#/components/schemas/ScoreQuestion"

    NoulQuestion:
      type: object
      title: noul (yes/no)
      required: [type, instructions, criteria]
      properties:
        type: {type: string, const: noul}
        instructions:
          type: string
          description: The question, written as you would for a careful human reviewer.
        criteria:
          type: object
          description: Description of what `true` and `false` mean. Exactly these two keys.
          required: ["true", "false"]
          additionalProperties: false
          properties:
            "true": {type: string}
            "false": {type: string}

    ChoiceQuestion:
      type: object
      title: choice (one of N)
      required: [type, instructions, criteria]
      properties:
        type: {type: string, const: choice}
        instructions: {type: string}
        criteria:
          type: object
          description: Option id → description. 2 to 255 options.
          minProperties: 2
          maxProperties: 255
          additionalProperties: {type: string}

    ScoreQuestion:
      type: object
      title: score (ordered scale)
      required: [type, instructions, criteria]
      properties:
        type: {type: string, const: score}
        instructions: {type: string}
        criteria:
          type: array
          description: 2 to 16 ordered level descriptions, lowest first. Answers are indexed "0", "1", … in this order.
          minItems: 2
          maxItems: 16
          items: {type: string}

    DecisionResponse:
      type: object
      required: [model, answers, usage, meta]
      properties:
        model:
          $ref: "#/components/schemas/ModelId"
        answers:
          type: object
          description: Question id → answer, same ids as the request.
          additionalProperties:
            $ref: "#/components/schemas/Answer"
        usage:
          $ref: "#/components/schemas/TokenUsage"
        meta:
          $ref: "#/components/schemas/Meta"

    Meta:
      type: object
      required: [request_id, mode, latency_ms]
      properties:
        request_id:
          type: string
          description: Unique id of this request; same value as the `X-Request-ID` header. Quote it to support.
        mode:
          type: string
          const: live
        latency_ms:
          type: integer
          description: Server-side time (admission, queue and inference); excludes your network round trip.
        cost_usd:
          type: string
          description: Prepaid keys — exact charge for this request in USD, as a decimal string.

    TokenUsage:
      type: object
      required: [input_tokens, output_tokens]
      properties:
        input_tokens:
          type: integer
          description: Billed input tokens (state once + every question).
        output_tokens:
          type: integer
          const: 0
          description: Always 0.

    Answer:
      oneOf:
        - $ref: "#/components/schemas/NoulAnswer"
        - $ref: "#/components/schemas/ChoiceAnswer"
        - $ref: "#/components/schemas/ScoreAnswer"
      discriminator:
        propertyName: type
        mapping:
          noul: "#/components/schemas/NoulAnswer"
          choice: "#/components/schemas/ChoiceAnswer"
          score: "#/components/schemas/ScoreAnswer"

    NoulAnswer:
      type: object
      required: [type, noul]
      properties:
        type: {type: string, const: noul}
        noul:
          type: number
          minimum: 0
          maximum: 1
          description: Probability that the answer is `true`.

    ChoiceAnswer:
      type: object
      required: [type, choice, confidence, probabilities]
      properties:
        type: {type: string, const: choice}
        choice:
          type: string
          description: The most likely option id.
        confidence:
          $ref: "#/components/schemas/Confidence"
        probabilities:
          type: object
          description: Option id → probability (sums to 1).
          additionalProperties: {type: number, minimum: 0, maximum: 1}

    ScoreAnswer:
      type: object
      required: [type, score, confidence, probabilities, legend]
      properties:
        type: {type: string, const: score}
        score:
          type: number
          description: Expected level on the scale, from 0 to N−1 (probability-weighted).
        confidence:
          $ref: "#/components/schemas/Confidence"
        probabilities:
          type: object
          description: Level index ("0" = lowest) → probability (sums to 1).
          propertyNames:
            pattern: "^[0-9]+$"
          additionalProperties: {type: number, minimum: 0, maximum: 1}
        legend:
          type: object
          description: Level index → the level description you sent.
          additionalProperties: {type: string}

    Confidence:
      type: number
      minimum: 0
      maximum: 1
      description: |
        Normalized inverse entropy of the probabilities, `1 − H(p) / ln(n)` for n options: 1 when one
        option holds all the probability, 0 when all are equally likely. Not the chosen option's probability.

    ModelList:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Model"

    Model:
      type: object
      required: [id]
      description: Model descriptor (extra fields may appear; clients must ignore unknown fields).
      properties:
        id:
          $ref: "#/components/schemas/ModelId"
        name: {type: string}
        created: {type: integer, description: Unix timestamp.}
        description: {type: string}
        quantization: {type: string}
        is_ready: {type: boolean}
        input_modalities:
          type: array
          items: {type: object}
        output_modalities:
          type: array
          items: {type: object}
        datacenters:
          type: array
          items:
            type: object
            properties:
              country_code: {type: string}
              region: {type: string}
        deployment_region: {type: string}

    Usage:
      type: object
      required: [key_id, plan, day_utc, requests_today, tokens_today, limits]
      properties:
        key_id: {type: string}
        plan: {type: string, description: "free, prepaid or a contract plan."}
        day_utc: {type: string, description: "YYYYMMDD (UTC)."}
        requests_today: {type: integer}
        tokens_today: {type: integer}
        limits:
          type: object
          properties:
            requests_per_minute: {type: [integer, "null"]}
            tokens_per_minute: {type: [integer, "null"]}
            requests_per_day: {type: [integer, "null"]}
            tokens_per_day: {type: [integer, "null"]}
            tokens_per_month: {type: [integer, "null"]}
        balance_usd: {type: number, description: Prepaid balance.}
        price_usd_per_million_input_tokens: {type: number}
        output_tokens_price: {type: number}
        history:
          type: array
          description: Daily history, last 90 days, newest first.
          items:
            type: object
            properties:
              day_utc: {type: string}
              requests: {type: integer}
              input_tokens: {type: integer}
              cost_usd: {type: number}
        purchases:
          type: array
          items:
            type: object
            properties:
              t: {type: integer, description: Unix timestamp.}
              usd: {type: number}
              ref: {type: string}

    RotatedKey:
      type: object
      required: [api_key, key_id]
      properties:
        api_key: {type: string, description: The new key (shown only once).}
        key_id: {type: string}
        plan: {type: string}
        old_key_valid_for_s: {type: integer}
        limits: {type: object}

    Error:
      type: object
      required: [error]
      properties:
        error:
          type: string
          description: Human-readable message saying what to fix.
        code:
          type: string
          description: Machine-readable code on some errors — `insufficient_credits` (402), `rate_limited` (429).
        contact_url:
          type: string
          description: Present on 402 — where to add credits.
        balance_usd:
          type: number
          description: Present on 402.

  headers:
    X-Request-ID:
      description: Unique id of the request, on every response (also errors); equals `meta.request_id`.
      schema: {type: string}
    X-RateLimit-Limit:
      description: Prepaid — requests per minute.
      schema: {type: integer}
    X-RateLimit-Remaining:
      description: Prepaid — requests remaining in the current window (burst bucket).
      schema: {type: integer}
    X-RateLimit-Reset:
      description: Prepaid — seconds until the request window refills.
      schema: {type: integer}
    X-RateLimit-Limit-Tokens:
      description: Prepaid — input tokens per minute.
      schema: {type: integer}
    X-RateLimit-Remaining-Tokens:
      description: Prepaid — input tokens remaining in the current window.
      schema: {type: integer}
    X-RateLimit-Limit-Tokens-Day:
      description: Free — input tokens per UTC day.
      schema: {type: integer}
    X-RateLimit-Remaining-Tokens-Day:
      description: Free — input tokens remaining today.
      schema: {type: integer}
    X-RateLimit-Reset-Day:
      description: Free — seconds until 00:00 UTC.
      schema: {type: integer}
    X-S1-Balance-USD:
      description: Prepaid — balance after this request.
      schema: {type: string}
    Retry-After:
      description: Seconds to wait before retrying.
      schema: {type: integer}

  responses:
    BadRequest:
      description: Invalid JSON, unknown model or malformed question.
      content:
        application/json:
          schema: {$ref: "#/components/schemas/Error"}
          examples:
            unknown_model: {value: {error: unknown model}}
            bad_type: {value: {error: "question s: type must be one of ['choice', 'noul', 'score']"}}
            noul_criteria: {value: {error: "question c: noul criteria must be exactly true/false"}}
    Unauthorized:
      description: Missing, wrong, rotated or revoked key.
      content:
        application/json:
          schema: {$ref: "#/components/schemas/Error"}
          example: {error: invalid API key}
    PaymentRequired:
      description: Prepaid balance is 0 or below — add credits.
      content:
        application/json:
          schema: {$ref: "#/components/schemas/Error"}
          example:
            error: "insufficient balance: add credits at https://punkytigerlabs.com/s1/ (prepaid, 0.042 USD per million input tokens)"
            balance_usd: -0.000004
    PayloadTooLarge:
      description: Body over 4 MB.
      content:
        application/json:
          schema: {$ref: "#/components/schemas/Error"}
          example: {error: request too large}
    Unprocessable:
      description: A question exceeds 32,768 tokens, the request exceeds 65,536 billable tokens, a choice has fewer than 2 or more than 255 options, or a score fewer than 2 or more than 16 levels.
      content:
        application/json:
          schema: {$ref: "#/components/schemas/Error"}
          examples:
            score_levels: {value: {error: "question s: score supports 2..16 levels"}}
            choice_options: {value: {error: "question c: 2..255 options"}}
    TooManyRequests:
      description: Daily or monthly quota used up, Prepaid per-minute limit, or fair queue full. Wait `Retry-After`.
      headers:
        Retry-After: {$ref: "#/components/headers/Retry-After"}
      content:
        application/json:
          schema: {$ref: "#/components/schemas/Error"}
          example: {error: "server busy: queue full, retry shortly"}
    ServiceUnavailable:
      description: Service temporarily unavailable. Wait `Retry-After` and retry.
      headers:
        Retry-After: {$ref: "#/components/headers/Retry-After"}
      content:
        application/json:
          schema: {$ref: "#/components/schemas/Error"}
          example: {error: service temporarily unavailable}

  examples:
    SupportTicketRequest:
      summary: Support ticket — refund, sentiment, urgency
      value:
        model: superion-s1-v6-int4e-vllm-kv1@sha256:e6dc49dc
        state: "Message: The laptop arrived broken. I want my money back now, this is unacceptable."
        questions:
          refund:
            type: noul
            instructions: Does the customer ask for a refund or a replacement?
            criteria: {"true": "yes", "false": "no"}
          sentiment:
            type: choice
            instructions: Overall sentiment of the message.
            criteria: {pos: positive, neg: negative, neu: neutral}
          urgency:
            type: score
            instructions: How urgent is a reply?
            criteria: [not urgent, somewhat urgent, very urgent]
    SupportTicketResponse:
      summary: Real response (v6, 12 Nov 2026, rounded to 4 decimals)
      value:
        model: superion-s1-v6-int4e-vllm-kv1@sha256:e6dc49dc
        answers:
          refund: {type: noul, noul: 0.9998}
          sentiment: {type: choice, choice: neg, confidence: 0.9661, probabilities: {pos: 0.0003, neg: 0.9941, neu: 0.0056}}
          urgency: {type: score, score: 1.9393, confidence: 0.7917, probabilities: {"0": 0.0, "1": 0.0607, "2": 0.9393}, legend: {"0": not urgent, "1": somewhat urgent, "2": very urgent}}
        usage: {input_tokens: 135, output_tokens: 0}
        meta: {request_id: 63a6718e-ab64-404b-92f3-fdba826d0dfe, mode: live, latency_ms: 103}
    ModerationRequest:
      summary: Content moderation
      value:
        model: superion-s1-v6-int4e-vllm-kv1@sha256:e6dc49dc
        state: "Comment: You are all idiots and I know where you live."
        questions:
          threat:
            type: noul
            instructions: Does the comment contain a threat of violence or intimidation?
            criteria: {"true": "contains a threat", "false": "no threat"}
          category:
            type: choice
            instructions: Main moderation category of the comment.
            criteria: {ok: acceptable, insult: insult or harassment, threat: threat, spam: spam}
