name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e "./python[dev]" -e "./integrations/langchain[test]" -e "./integrations/llamaindex[test]" openapi-spec-validator pyyaml jsonschema nbformat nbclient
      - run: pytest -q python/tests
      - run: pytest -q integrations/langchain/tests/unit_tests
      - run: pytest -q integrations/llamaindex/tests
      - run: pytest -q openapi/tests postman/tests -p no:asyncio
      - run: pytest -q notebooks/tests -k "not runs"
  js:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: js
    strategy:
      matrix:
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: js/package-lock.json
      - run: npm ci
      - run: npm run typecheck && npm test && npm run build
